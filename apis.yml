aid: fortuna-health
name: Fortuna Health
description: >-
  Fortuna Health is a consumer-first Medicaid navigation platform that helps
  patients and members move through the Medicaid enrollment, recertification,
  appeals, and coverage-management processes end to end. Founded in 2023 and
  based in New York City, Fortuna consolidates the fragmented rules of the 50+
  state and territory Medicaid programs — each with its own eligibility rules,
  documentation standards, and renewal timelines — into a single digital
  interface. The platform lets consumers connect accounts that auto-populate
  their filings, provides a virtual mailbox for state and health-plan
  communications, and sends text notifications for urgent, time-sensitive
  actions. Fortuna partners with health systems and managed care plans as
  middleware for the roughly $800B Medicaid ecosystem, and is backed by
  Andreessen Horowitz (a16z) and Y Combinator.
